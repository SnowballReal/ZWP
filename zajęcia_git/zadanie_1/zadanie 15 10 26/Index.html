<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Gier Komputerowych</title>
    <link rel="stylesheet" href="tyskie.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(function(){
            $("#newsteller").change(function(){
                if ($(this).is(":checked")){
                    $("#info").text("zapisano się do kradzierzy danych")
                }else {
                    $("#info").text("")
                }
            })

            $("#termsAccept").change(function(){
                if ($(this).is(":checked")){
                    $("#submit").prop("disabled",false)
                }else{
                    $("#submit").prop("disabled",true)
                }
            })

            $("#tekst").on("input", function(){
                $("#podgląd").text($(this).val())
            })

            $("#tekst2").on("input", function(){
                var n = (100 - $(this).val().length)
                $("#znaki").text( n)
                if (n < 10) {
                    $("#pozostało").css("color", "red")
                }else{
                    $("#pozostało").css("color", "black")
                }
            })
        })
    </script>
    
</head>
<body>
    <input type="checkbox" id="newsteller"> <label>jo chcieć njus teler</label>
    <input type="checkbox" id="termsAccept"> <label>akceptuje regulamin strony</label>
    <button disabled="true" id="submit">submit</button>
    <p id="info"></p>
    <hr>
    <input type="text" id="tekst">
    <p>podgląd : <span id="podgląd"></span></p>
    <hr>
    <input type="text" id="tekst2">
    <p id="pozostało" >pozostało <span id="znaki">100</span> znaków</p>
</body>
</html>
